<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OrangeHRM Autotest Reports</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    max-width: 820px;
    margin: 48px auto;
    padding: 0 16px;
    background: #f5f6fa;
    color: #1a1a2e;
  }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  p.sub { color: #6b7280; margin-top: 0; margin-bottom: 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    display: block;
    background: #fff;
    border-radius: 12px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .kind {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .kind.smoke { background: #2da44e; }
  .kind.regression { background: #8250df; }
  .status {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 20px;
  }
  .status.ok { background: #dcfce7; color: #166534; }
  .status.fail { background: #fee2e2; color: #991b1b; }
  .status.unknown { background: #f1f5f9; color: #475569; }
  .label { font-size: 0.85rem; color: #374151; }
</style>
</head>
<body>
<h1>OrangeHRM Autotest Reports</h1>
<p class="sub">Pick a run below to open its full HTML report.</p>
<div class="grid">
<a class="card" href="reports/smoke/2026-08-02_15-10-run30/index.html">
      <div class="card-top">
        <span class="kind smoke">smoke</span>
        <span class="status fail">failed</span>
      </div>
      <div class="label">2026-08-02_15-10-run30</div>
    </a>
<a class="card" href="reports/smoke/2026-08-02_15-03-run29/index.html">
      <div class="card-top">
        <span class="kind smoke">smoke</span>
        <span class="status unknown">unknown</span>
      </div>
      <div class="label">2026-08-02_15-03-run29</div>
    </a>
<a class="card" href="reports/smoke/2026-08-02_14-53-run28/index.html">
      <div class="card-top">
        <span class="kind smoke">smoke</span>
        <span class="status unknown">unknown</span>
      </div>
      <div class="label">2026-08-02_14-53-run28</div>
    </a>
</div>
</body>
</html>
