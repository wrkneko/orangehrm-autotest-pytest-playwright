name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # nightly full regression run at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      marker:
        description: "Pytest marker to run (smoke, regression, or empty for all)"
        required: false
        default: ""

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Runs on every push/PR — fast, only business-critical paths
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_ENV: ci
      BASE_URL: ${{ vars.BASE_URL }}
      ORANGEHRM_USER: ${{ secrets.ORANGEHRM_USER }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
      AI_TOKEN: ${{ secrets.AI_TOKEN }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run smoke tests
        run: pytest -m smoke --tracing=retain-on-failure --html=report.html --self-contained-html --css=config/report.css

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-report
          path: report.html
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 14

  regression:
    # Full regression: nightly schedule, or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_ENV: ci
      BASE_URL: ${{ vars.BASE_URL }}
      ORANGEHRM_USER: ${{ secrets.ORANGEHRM_USER }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
      AI_TOKEN: ${{ secrets.AI_TOKEN }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run regression suite
        run: |
          MARKER="${{ github.event.inputs.marker }}"
          if [ -z "$MARKER" ]; then
            pytest --tracing=retain-on-failure --html=report.html --self-contained-html --css=config/report.css
          else
            pytest -m "$MARKER" --tracing=retain-on-failure --html=report.html --self-contained-html --css=config/report.css
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: regression-report
          path: report.html
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: regression-traces
          path: test-results/
          retention-days: 14

  publish-report:
    # Publishes the just-generated report.html to GitHub Pages, keeping
    # every previous run's report browsable via a version-picker index.
    name: Publish report to Pages
    needs: [smoke, regression]
    if: always() && (needs.smoke.result != 'skipped' || needs.regression.result != 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine which job ran
        id: meta
        run: |
          if [ "${{ needs.smoke.result }}" != "skipped" ]; then
            kind="smoke"
            status="${{ needs.smoke.result }}"
          else
            kind="regression"
            status="${{ needs.regression.result }}"
          fi
          label="$(date -u +'%Y-%m-%d_%H-%M')-run${{ github.run_number }}"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Download report artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.meta.outputs.kind }}-report
          path: downloaded-report

      - name: Checkout or initialize gh-pages branch
        run: |
          rm -rf gh-pages
          mkdir gh-pages
          cd gh-pages
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q origin gh-pages || true
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            git checkout -q -b gh-pages origin/gh-pages
          else
            git checkout -q -b gh-pages
          fi

      - name: Configure git identity
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add this run's report
        run: |
          dest="gh-pages/reports/${{ steps.meta.outputs.kind }}/${{ steps.meta.outputs.label }}"
          mkdir -p "$dest"
          cp downloaded-report/report.html "$dest/index.html"
          echo "${{ steps.meta.outputs.status }}" > "$dest/status.txt"

      - name: Rebuild version-picker index.html
        run: |
          python3 - <<'PY'
          import os

          base = "gh-pages/reports"
          rows = []
          if os.path.isdir(base):
              for kind in sorted(os.listdir(base)):
                  kind_dir = os.path.join(base, kind)
                  if not os.path.isdir(kind_dir):
                      continue
                  for label in os.listdir(kind_dir):
                      entry_dir = os.path.join(kind_dir, label)
                      if not os.path.isdir(entry_dir):
                          continue
                      status_file = os.path.join(entry_dir, "status.txt")
                      status = "unknown"
                      if os.path.exists(status_file):
                          with open(status_file, encoding="utf-8") as f:
                              status = f.read().strip()
                      rows.append((kind, label, status))

          # newest first (labels start with an ISO date, so string sort works)
          rows.sort(key=lambda r: r[1], reverse=True)

          def status_class(status):
              return {"success": "ok", "failure": "fail"}.get(status, "unknown")

          def status_label(status):
              return {"success": "passed", "failure": "failed"}.get(status, status)

          cards = "\n".join(
              f'''<a class="card" href="reports/{kind}/{label}/index.html">
                <div class="card-top">
                  <span class="kind {kind}">{kind}</span>
                  <span class="status {status_class(status)}">{status_label(status)}</span>
                </div>
                <div class="label">{label}</div>
              </a>'''
              for kind, label, status in rows
          )

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>OrangeHRM Autotest Reports</title>
          <style>
            * {{ box-sizing: border-box; }}
            body {{
              font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
              max-width: 820px;
              margin: 48px auto;
              padding: 0 16px;
              background: #f5f6fa;
              color: #1a1a2e;
            }}
            h1 {{ font-size: 1.6rem; margin-bottom: 4px; }}
            p.sub {{ color: #6b7280; margin-top: 0; margin-bottom: 28px; }}
            .grid {{
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
              gap: 14px;
            }}
            .card {{
              display: block;
              background: #fff;
              border-radius: 12px;
              padding: 16px 18px;
              text-decoration: none;
              color: inherit;
              box-shadow: 0 1px 4px rgba(0,0,0,0.08);
              transition: transform 0.12s ease, box-shadow 0.12s ease;
            }}
            .card:hover {{
              transform: translateY(-2px);
              box-shadow: 0 4px 14px rgba(0,0,0,0.12);
            }}
            .card-top {{
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 10px;
            }}
            .kind {{
              display: inline-block;
              padding: 3px 10px;
              border-radius: 20px;
              font-size: 0.75rem;
              font-weight: 600;
              color: #fff;
              text-transform: uppercase;
              letter-spacing: 0.03em;
            }}
            .kind.smoke {{ background: #2da44e; }}
            .kind.regression {{ background: #8250df; }}
            .status {{
              font-size: 0.8rem;
              font-weight: 600;
              padding: 2px 9px;
              border-radius: 20px;
            }}
            .status.ok {{ background: #dcfce7; color: #166534; }}
            .status.fail {{ background: #fee2e2; color: #991b1b; }}
            .status.unknown {{ background: #f1f5f9; color: #475569; }}
            .label {{ font-size: 0.85rem; color: #374151; }}
          </style>
          </head>
          <body>
          <h1>OrangeHRM Autotest Reports</h1>
          <p class="sub">Pick a run below to open its full HTML report.</p>
          <div class="grid">
          {cards}
          </div>
          </body>
          </html>
          """

          with open("gh-pages/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          PY

      - name: Commit and push report
        run: |
          cd gh-pages
          git add -A
          git commit -q -m "Publish ${{ steps.meta.outputs.kind }} report (run ${{ github.run_number }})" || echo "Nothing to commit"
          git push -q origin gh-pages --force-with-lease || git push -q origin gh-pages