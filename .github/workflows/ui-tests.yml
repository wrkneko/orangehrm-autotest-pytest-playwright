name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # nightly full regression run at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      marker:
        description: "Pytest marker to run (smoke, regression, or empty for all)"
        required: false
        default: ""

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Runs on every push/PR — fast, only business-critical paths
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_ENV: ci
      BASE_URL: ${{ vars.BASE_URL }}
      ORANGEHRM_USER: ${{ secrets.ORANGEHRM_USER }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
      AI_TOKEN: ${{ secrets.AI_TOKEN }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run smoke tests
        run: pytest -m smoke --tracing=retain-on-failure --html=report.html --self-contained-html --css=config/report/report.css

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-report
          path: report.html
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 14

  regression:
    # Full regression: nightly schedule, or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_ENV: ci
      BASE_URL: ${{ vars.BASE_URL }}
      ORANGEHRM_USER: ${{ secrets.ORANGEHRM_USER }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
      AI_TOKEN: ${{ secrets.AI_TOKEN }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run regression suite
        run: |
          MARKER="${{ github.event.inputs.marker }}"
          if [ -z "$MARKER" ]; then
            pytest --tracing=retain-on-failure --html=report.html --self-contained-html --css=config/report/report.css
          else
            pytest -m "$MARKER" --tracing=retain-on-failure --html=report.html --self-contained-html --css=config/report/report.css
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: regression-report
          path: report.html
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: regression-traces
          path: test-results/
          retention-days: 14

  publish-report:
    # Publishes the just-generated report.html to GitHub Pages, keeping
    # every previous run's report browsable via a version-picker index.
    name: Publish report to Pages
    needs: [smoke, regression]
    if: always() && (needs.smoke.result != 'skipped' || needs.regression.result != 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Must run before download-artifact: checkout wipes untracked files
      # from the workspace, which would delete the downloaded report.
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: config/report

      - name: Determine which job ran
        id: meta
        run: |
          if [ "${{ needs.smoke.result }}" != "skipped" ]; then
            kind="smoke"
            status="${{ needs.smoke.result }}"
          else
            kind="regression"
            status="${{ needs.regression.result }}"
          fi
          label="$(date -u +'%Y-%m-%d_%H-%M')-run${{ github.run_number }}"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Download report artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.meta.outputs.kind }}-report
          path: downloaded-report

      - name: Checkout or initialize gh-pages branch
        run: |
          rm -rf gh-pages
          mkdir gh-pages
          cd gh-pages
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q origin gh-pages || true
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            git checkout -q -b gh-pages origin/gh-pages
          else
            git checkout -q -b gh-pages
          fi

      - name: Configure git identity
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add this run's report
        run: |
          dest="gh-pages/reports/${{ steps.meta.outputs.kind }}/${{ steps.meta.outputs.label }}"
          mkdir -p "$dest"
          cp downloaded-report/report.html "$dest/index.html"
          echo "${{ steps.meta.outputs.status }}" > "$dest/status.txt"

      - name: Rebuild version-picker index.html
        run: |
          python3 config/report/build_index.py \
            --reports-dir gh-pages/reports \
            --output gh-pages/index.html

      - name: Commit and push report
        run: |
          cd gh-pages
          git add -A
          git commit -q -m "Publish ${{ steps.meta.outputs.kind }} report (run ${{ github.run_number }})" || echo "Nothing to commit"
          git push -q origin gh-pages --force-with-lease || git push -q origin gh-pages