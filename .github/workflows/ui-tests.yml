name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # nightly full regression run at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      marker:
        description: "Pytest marker to run (smoke, regression, or empty for all)"
        required: false
        default: ""

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Runs on every push/PR — fast, only business-critical paths
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_ENV: ci
      BASE_URL: ${{ vars.BASE_URL }}
      ORANGEHRM_USER: ${{ secrets.ORANGEHRM_USER }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run smoke tests
        run: pytest -m smoke --tracing=retain-on-failure --html=report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: report.html
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 14

  regression:
    # Full regression: nightly schedule, or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_ENV: ci
      BASE_URL: ${{ vars.BASE_URL }}
      ORANGEHRM_USER: ${{ secrets.ORANGEHRM_USER }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run regression suite
        run: |
          MARKER="${{ github.event.inputs.marker }}"
          if [ -z "$MARKER" ]; then
            pytest --tracing=retain-on-failure --html=report.html --self-contained-html
          else
            pytest -m "$MARKER" --tracing=retain-on-failure --html=report.html --self-contained-html
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: report.html
          retention-days: 14

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-traces
          path: test-results/
          retention-days: 14