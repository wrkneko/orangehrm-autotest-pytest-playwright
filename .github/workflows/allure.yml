name: Allure Report

# Starts only after UI Tests has finished, and picks up the allure-results
# that run uploaded. Keeping this in its own file means the test workflow
# stays about running tests, and this one about rendering them.
on:
  workflow_run:
    workflows: ["UI Tests"]
    types: [completed]

# Shared with the publish job in ui-tests.yml. Both workflows push to the
# gh-pages branch, in queue. cancel-in-progress must
# stay false here — a cancelled publish would silently drop a report.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish-allure:
    name: Build and publish Allure report
    # A cancelled test run has nothing worth rendering. Failed runs do — a
    # red Allure report is the interesting one.
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: config/report

      - name: Download allure-results from the test run
        uses: actions/download-artifact@v5
        with:
          pattern: "*-allure-results"
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Identify the run
        id: meta
        run: |
          dir="$(find artifacts -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$dir" ]; then
            echo "::error::No *-allure-results artifact found in run ${{ github.event.workflow_run.id }}."
            exit 1
          fi

          kind="$(basename "$dir")"
          kind="${kind%-allure-results}"
          # Reuse the test run's number so this entry lines up with the
          # pytest-html one published for the same run.
          label="$(date -u -d '${{ github.event.workflow_run.created_at }}' +'%Y-%m-%d_%H-%M')-run${{ github.event.workflow_run.run_number }}"

          mv "$dir" results
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "Publishing $kind report as $label"

      - name: Checkout or initialize gh-pages branch
        run: |
          rm -rf gh-pages
          mkdir gh-pages
          cd gh-pages
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q origin gh-pages || true
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            git checkout -q -b gh-pages origin/gh-pages
          else
            git checkout -q -b gh-pages
          fi

      - name: Restore Allure history
        # Trends and retry history only appear if the previous report's
        # history/ folder is seeded into the new results before generating.
        run: |
          src="gh-pages/allure-history/${{ steps.meta.outputs.kind }}"
          if [ -d "$src" ]; then
            mkdir -p results/history
            cp -r "$src/." results/history/
            echo "Seeded history from $src"
          else
            echo "No history for ${{ steps.meta.outputs.kind }} yet; starting a new trend."
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Allure CLI
        run: npm install -g allure-commandline@2.43.0

      - name: Generate Allure report
        run: allure generate results --clean -o allure-report

      - name: Publish report and carry history forward
        run: |
          dest="gh-pages/allure/${{ steps.meta.outputs.kind }}/${{ steps.meta.outputs.label }}"
          mkdir -p "$dest"
          cp -r allure-report/. "$dest/"

          # Status comes from the report's own summary, not the workflow
          # conclusion, so the card reflects the tests rather than the job.
          python3 -c 'import json; s = json.load(open("allure-report/widgets/summary.json"))["statistic"]; print("failure" if s.get("failed", 0) + s.get("broken", 0) else "success")' > "$dest/status.txt"
          echo "Status: $(cat "$dest/status.txt")"

          # Kept outside gh-pages/allure/ so the index does not list it as a run.
          hist="gh-pages/allure-history/${{ steps.meta.outputs.kind }}"
          rm -rf "$hist"
          mkdir -p "$hist"
          cp -r allure-report/history/. "$hist/"

      - name: Rebuild index
        run: python3 config/report/build_index.py --pages-dir gh-pages

      - name: Configure git identity
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push report
        run: |
          cd gh-pages
          git add -A
          git commit -q -m "Publish ${{ steps.meta.outputs.kind }} Allure report (run ${{ github.event.workflow_run.run_number }})" || echo "Nothing to commit"
          git push -q origin gh-pages --force-with-lease || git push -q origin gh-pages
