[pytest]
markers =
    smoke: quick sanity checks for critical flows
    regression: full regression suite
    ui: browser-based UI tests
    api: API-level tests

testpaths = tests
addopts =
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
    --reruns=1
    --reruns-delay=2

log_cli = true
log_cli_level = INFO
